name: Drive Paketini Aktar (tek dosya)

# Drive'da tek bir zip (APK paketi) verilir; zip indirilir, içindeki APK'lar
# aapt2 ile okunur (paket adı + sürüm), apk/ klasörüne kanonik adıyla yazılır,
# ikonlar çıkarılır, kataloglar üretilir ve commit edilir.
#
# "zorla: evet" ise zip'teki dosya sürüm aynı/eski olsa bile birebir kopyalanır
# ve o eklentiler tools/pinli.txt içine yazılır (upstream işi bunları ezmez).
on:
  workflow_dispatch:
    inputs:
      dosya:
        description: "Drive dosya linki veya ID"
        required: true
        default: "1HzjVOvi9BO48bnFbXyk8rl3cIh4d_xov"
      mod:
        description: "kesif (sadece rapor) | uygula (repoya işle)"
        required: true
        default: "uygula"
        type: choice
        options: [kesif, uygula]
      zorla:
        description: "zorla: zip'teki dosyayı koşulsuz yaz (evet/hayir)"
        required: true
        default: "evet"
        type: choice
        options: [evet, hayir]

permissions:
  contents: write

concurrency:
  group: paket-aktar
  cancel-in-progress: false

jobs:
  aktar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: gdown kur
        run: pip install --quiet gdown

      - name: Drive dosyasını indir
        env:
          DOSYA: ${{ inputs.dosya }}
        run: |
          mkdir -p "$RUNNER_TEMP/paket"
          ID=$(python3 - <<'PY'
          import os, re
          s = os.environ["DOSYA"].strip()
          m = re.search(r"/d/([A-Za-z0-9_-]{20,})", s) or re.search(r"[?&]id=([A-Za-z0-9_-]{20,})", s)
          print(m.group(1) if m else s)
          PY
          )
          echo "dosya id: $ID"
          gdown "$ID" -O "$RUNNER_TEMP/paket/girdi.zip" 2>&1 | tail -5
          ls -la "$RUNNER_TEMP/paket"

      - name: İçerik envanteri
        run: |
          python3 - <<'PY'
          import zipfile, os
          p = os.environ["RUNNER_TEMP"] + "/paket/girdi.zip"
          with zipfile.ZipFile(p) as z:
              names = z.namelist()
              print(f"girdi sayısı: {len(names)}")
              for n in names[:400]:
                  print(" ", n)
              print("toplam apk:", sum(1 for n in names if n.lower().endswith(".apk")))
              print("toplam kt :", sum(1 for n in names if n.lower().endswith(".kt")))
          PY

      - name: APK'ları çöz + aktar + rapor
        env:
          MOD: ${{ inputs.mod }}
          ZORLA: ${{ inputs.zorla }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os, re, zipfile, shutil, subprocess, pathlib, json, datetime, hashlib

          MOD = os.environ["MOD"]
          ZORLA = os.environ.get("ZORLA", "evet") == "evet"
          repo = pathlib.Path.cwd()
          apk_dir = repo / "apk"
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])
          src = tmp / "paket" / "girdi.zip"
          out = tmp / "paket" / "out"
          out.mkdir(parents=True, exist_ok=True)

          lines = []
          def say(s=""):
              print(s); lines.append(s)

          def sha(p):
              h = hashlib.sha256()
              h.update(pathlib.Path(p).read_bytes())
              return h.hexdigest()

          def vt(s):
              try:
                  return tuple(int(x) for x in s.split("."))
              except ValueError:
                  return (0,)

          say("# Drive Paketi Aktarım Raporu")
          say()
          say(f"- Tarih: {datetime.datetime.utcnow():%Y-%m-%d %H:%M} UTC")
          say(f"- Mod: **{MOD}** | zorla: **{'evet' if ZORLA else 'hayır'}**")
          say(f"- Çalışma: {os.environ.get('RUN_URL','')}")
          say()

          with zipfile.ZipFile(src) as z:
              z.extractall(out)

          apks = sorted(p for p in out.rglob("*") if p.is_file() and p.suffix.lower() == ".apk")
          pngs = sorted(p for p in out.rglob("*") if p.is_file() and p.suffix.lower() == ".png")
          kts = sorted(p for p in out.rglob("*") if p.is_file() and p.suffix.lower() == ".kt")
          say(f"- APK: {len(apks)} | PNG: {len(pngs)} | Kotlin kaynak: {len(kts)}")
          say()

          aapt = None
          for cand in sorted(pathlib.Path(os.environ.get("ANDROID_HOME", "/usr/local/lib/android/sdk")).glob("build-tools/*/aapt2"), reverse=True):
              if cand.is_file():
                  aapt = str(cand); break
          say(f"- aapt2: `{aapt}`")
          say()

          def badging(path):
              if not aapt:
                  return {}
              r = subprocess.run([aapt, "dump", "badging", str(path)], capture_output=True, text=True)
              if r.returncode != 0:
                  return {}
              m = re.search(r"package: name='([^']+)' versionCode='([^']*)' versionName='([^']*)'", r.stdout)
              if not m:
                  return {}
              label = re.search(r"application-label:'([^']*)'", r.stdout)
              icon = re.search(r"application-icon-\d+:'([^']*)'", r.stdout)
              return {
                  "pkg": m.group(1), "code": m.group(2), "version": m.group(3),
                  "label": label.group(1) if label else None,
                  "icon_path": icon.group(1) if icon else None,
              }

          def apk_icon(path, res_path):
              try:
                  with zipfile.ZipFile(path) as z:
                      names = [n for n in z.namelist() if n.startswith("res/") and n.lower().endswith(".png")]
                      if res_path and res_path in names:
                          return z.read(res_path)
                      best = None
                      for n in names:
                          if "ic_launcher" in n and (best is None or len(z.read(n)) > len(z.read(best))):
                              best = n
                      if best:
                          return z.read(best)
              except Exception:
                  pass
              return None

          plan, skipped = [], []
          for a in apks:
              info = badging(a)
              if not info.get("pkg"):
                  skipped.append((a.name, "paket adı okunamadı"))
                  continue
              parts = info["pkg"].split(".")
              info.update({
                  "lang": parts[-2] if len(parts) >= 2 else "tr",
                  "slug": parts[-1],
                  "ver": info.get("version") or "1.6.0",
                  "file": a,
                  "zip_sha": sha(a),
              })
              plan.append(info)

          say("## Paketteki eklentiler")
          say()
          say("| Paket | Zip sürümü | Kod | Görünen ad |")
          say("|---|---|---|---|")
          for i in plan:
              say(f"| `{i['pkg']}` | {i['ver']} | {i.get('code','?')} | {i.get('label','?')} |")
          if skipped:
              say()
              for n, why in skipped:
                  say(f"- atlandı: `{n}` — {why}")
          say()

          yazilan, eski_surum, dokunulmadi, ayni_hash = [], [], [], []
          if MOD == "uygula":
              for i in plan:
                  target = apk_dir / f"tachiyomi-{i['lang']}.{i['slug']}-v{i['ver']}.apk"
                  icon_target = apk_dir / f"{i['pkg']}.png"
                  old = [p for p in apk_dir.glob(f"tachiyomi-{i['lang']}.{i['slug']}-v*.apk")]
                  older_versions = [p for p in old if vt(re.search(r"-v(\d+\.\d+\.\d+)\.apk$", p.name).group(1)) > vt(i["ver"])]

                  if not ZORLA and older_versions:
                      dokunulmadi.append((i["pkg"], i["ver"], sorted(p.name for p in older_versions)))
                      continue

                  already_same = target.is_file() and sha(target) == i["zip_sha"]
                  if already_same:
                      ayni_hash.append(i["pkg"])
                  else:
                      shutil.copy2(i["file"], target)
                      if older_versions:
                          eski_surum.append((i["pkg"], i["ver"], [p.name for p in older_versions]))
                      else:
                          yazilan.append((i["pkg"], i["ver"]))
                  for p in old:
                      if p.name != target.name:
                          p.unlink()
                  if not icon_target.exists():
                      data = None
                      for png in pngs:
                          if png.name == f"{i['pkg']}.png":
                              data = png.read_bytes(); break
                      if data is None:
                          data = apk_icon(i["file"], i.get("icon_path"))
                      if data:
                          icon_target.write_bytes(data)

              # sabitleme listesi: bu eklentiler upstream tarafından ezilmez
              pin_file = repo / "tools" / "pinli.txt"
              pins = set()
              if pin_file.is_file():
                  pins = {l.strip() for l in pin_file.read_text(encoding="utf-8").splitlines() if l.strip()}
              pins |= {i["slug"] for i in plan}
              pin_file.parent.mkdir(parents=True, exist_ok=True)
              pin_file.write_text("\n".join(sorted(pins)) + "\n", encoding="utf-8")

              # isim haritası (APK etiketi -> ad)
              name_file = repo / "tools" / "isimler.json"
              name_map = {}
              if name_file.is_file():
                  try:
                      name_map = json.loads(name_file.read_text(encoding="utf-8"))
                  except json.JSONDecodeError:
                      name_map = {}
              for i in plan:
                  label = (i.get("label") or "").replace("Tachiyomi: ", "").strip()
                  if label:
                      name_map[i["slug"]] = label
              name_file.write_text(json.dumps(dict(sorted(name_map.items())), ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          say("## Sonuç")
          say()
          if MOD != "uygula":
              say("_keşif modu — dosya yazılmadı._")
          else:
              say(f"- Zip'ten **birebir yazılan**: {len(yazilan)}")
              for p, v in yazilan:
                  say(f"  - `{p}` {v}")
              say(f"- Zip'ten yazılıp daha yeni sürümü kaldırılan: {len(eski_surum)}")
              for p, v, olds in eski_surum:
                  say(f"  - `{p}` {v} (silinen: {', '.join(olds)})")
              say(f"- Zaten birebir aynı (hash eşleşti): {len(ayni_hash)}")
              for p in ayni_hash:
                  say(f"  - `{p}`")
              if dokunulmadi:
                  say(f"- Zorla kapalı olduğu için dokunulmayan: {len(dokunulmadi)}")
                  for p, v, olds in dokunulmadi:
                      say(f"  - `{p}` {v} (repoda {', '.join(olds)})")
              say()
              say(f"Toplam paket: **{len(plan)}** · doğrulanan: **{len(yazilan) + len(eski_surum) + len(ayni_hash)}**")
          say()

          (repo / "docs").mkdir(exist_ok=True)
          (repo / "docs" / "paket-raporu.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Katalog üret
        if: inputs.mod == 'uygula'
        run: python3 tools/build_catalog.py

      - name: Değişiklikleri gönder
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git diff --cached --stat | tail -20
          git commit -m "chore(paket): zip'teki APK'ları birebir yaz (zorla: ${{ inputs.zorla }}) + sabitleme listesi"
          git push
